<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Portal</title>

<style>
  /* ---- Basic look ---- */
  body   { margin: 0; font-family: system-ui, sans-serif; background: #f6f8f8; color: #222; }
  h2     { margin: 0 0 12px; }
  button { padding: 7px 14px; border: 0; border-radius: 6px; background: #0f8b8d; color: #fff; cursor: pointer; }
  button.light { background: #e6efee; color: #12313a; }
  input, select, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; border: 1px solid #ccd6d4; border-radius: 6px; font: inherit; box-sizing: border-box; }
  label  { font-weight: bold; font-size: 14px; }
  .hidden { display: none; }

  /* ---- Login card ---- */
  #loginPage { max-width: 320px; margin: 15vh auto; background: #fff; padding: 24px; border-radius: 10px; }
  #loginError { color: #c8413b; min-height: 20px; }

  /* ---- Top bar and tabs ---- */
  header { background: #fff; border-bottom: 1px solid #dde5e3; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  nav button { background: none; color: #555; padding: 6px 12px; }
  nav button.active { color: #0f8b8d; font-weight: bold; border-bottom: 2px solid #0f8b8d; border-radius: 0; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }

  /* ---- Tables ---- */
  table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eef2f1; }
  th { background: #eef3f2; font-size: 13px; color: #667; }
  .empty { background: #fff; padding: 20px; border-radius: 8px; color: #777; }

  /* ---- Popup form ---- */
  dialog { border: 0; border-radius: 10px; padding: 22px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage">
  <h2>Doctor Login</h2>
  <label>Username</label>
  <input id="username" value="doctor">          <!--Username:-doctor   Password:-doctor123-->
  <label>Password</label>
  <input id="password" type="password" value="doctor123">
  <p id="loginError"></p>
  <button onclick="login()">Sign in</button>
</div>

<!-- ================= PORTAL ================= -->
<div id="portal" class="hidden">
  <header>
    <b id="doctorName"></b>
    <nav>
      <button id="tab-queue"   onclick="showTab('queue')">Appointments</button>
      <button id="tab-history" onclick="showTab('history')">Consultations</button>
      <button id="tab-labs"    onclick="showTab('labs')">Lab results</button>
    </nav>
    <button class="light" onclick="logout()">Sign out</button>
  </header>

  <main>
    <div id="page-queue"></div>
    <div id="page-history" class="hidden"></div>
    <div id="page-labs" class="hidden"></div>
  </main>
</div>

<!-- ================= CONSULTATION POPUP ================= -->
<dialog id="consultDialog">
  <h2 id="consultTitle"></h2>

  <label>Diagnosis</label>
  <input id="diagnosis">

  <label>Notes</label>
  <textarea id="notes" rows="3"></textarea>

  <label>Medicine (optional)</label>
  <select id="medicine"></select>

  <label>Dosage</label>
  <input id="dosage" placeholder="e.g. 1 tablet twice a day for 5 days">

  <label>Lab test (optional)</label>
  <select id="labTest"></select>

  <button onclick="saveConsultation()">Save</button>
  <button class="light" onclick="consultDialog.close()">Cancel</button>
</dialog>


<script>
// =====================================================
// 1. DATABASE  (uses the browser's localStorage)
//    To use your real backend later, only change these functions.
// =====================================================

// Read a whole table, e.g. getTable('patients')
function getTable(name) {
  return JSON.parse(localStorage.getItem('cms_' + name) || '[]');
}

// Save a whole table
function saveTable(name, rows) {
  localStorage.setItem('cms_' + name, JSON.stringify(rows));
}

// Add one row and give it an id
function addRow(name, row) {
  const rows = getTable(name);
  row.id = Date.now() + Math.floor(Math.random() * 1000);
  row.created = new Date().toISOString();
  rows.push(row);
  saveTable(name, rows);
}

// Change fields of one row, e.g. updateRow('appts', 5, { status: 'completed' })
function updateRow(name, id, changes) {
  const rows = getTable(name).map(row => row.id == id ? { ...row, ...changes } : row);
  saveTable(name, rows);
}

// Find one row by id
function findRow(name, id) {
  return getTable(name).find(row => row.id == id) || {};
}


// =====================================================
// 2. SAMPLE DATA  (created once, so you have something to see)
// =====================================================
function createSampleData() {
  if (localStorage.getItem('cms_seeded')) return;

  addRow('users', { name: 'System Admin',   username: 'admin',     password: 'admin123',  role: 'admin' });
  addRow('users', { name: 'Anita Rao',      username: 'reception', password: 'recep123',  role: 'reception' });
  addRow('users', { name: 'Dr. Meera Nair', username: 'doctor',    password: 'doctor123', role: 'doctor' });
  addRow('users', { name: 'Ravi Kumar',     username: 'pharma',    password: 'pharma123', role: 'pharmacist' });
  addRow('users', { name: 'Sneha Pillai',   username: 'lab',       password: 'lab123',    role: 'lab' });

  addRow('patients', { code: 'P-1001', name: 'Arun Menon', age: 34, gender: 'Male',   phone: '9847000001', address: 'Kowdiar' });
  addRow('patients', { code: 'P-1002', name: 'Latha S',    age: 52, gender: 'Female', phone: '9847000002', address: 'Pattom' });

  addRow('meds', { name: 'Paracetamol 500mg', stock: 120, min: 30 });
  addRow('meds', { name: 'Amoxicillin 250mg', stock: 60,  min: 20 });
  addRow('meds', { name: 'Metformin 500mg',   stock: 15,  min: 20 });

  const doctor   = getTable('users').find(u => u.role === 'doctor');
  const patients = getTable('patients');
  addRow('appts', { pid: patients[0].id, did: doctor.id, date: today(), time: '10:00', reason: 'Fever for 3 days',        status: 'checkedin' });
  addRow('appts', { pid: patients[1].id, did: doctor.id, date: today(), time: '10:30', reason: 'Routine diabetes review', status: 'booked' });

  localStorage.setItem('cms_seeded', '1');
}


// =====================================================
// 3. SMALL HELPERS
// =====================================================
const LAB_TESTS = ['Complete blood count', 'Blood sugar (fasting)', 'Lipid profile', 'Urine routine', 'Liver function test'];

let doctor = null;            // the logged-in doctor
let appointmentBeingSeen = null;  // the appointment open in the popup

function today() {
  return new Date().toISOString().slice(0, 10);
}

// Stops text from being treated as HTML (safe to show user-typed text)
function safe(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

function patientName(id) {
  return safe(findRow('patients', id).name || 'Unknown');
}

// Build a table from column titles and rows of cells (each row is a list of HTML strings)
function makeTable(titles, rows, emptyMessage) {
  if (rows.length === 0) return `<div class="empty">${emptyMessage}</div>`;

  const head = titles.map(t => `<th>${t}</th>`).join('');
  const body = rows.map(cells => '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
  return `<table><tr>${head}</tr>${body}</table>`;
}


// =====================================================
// 4. LOGIN / LOGOUT
// =====================================================
function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  const user = getTable('users').find(u =>
    u.role === 'doctor' && u.username === username && u.password === password);

  if (!user) {
    document.getElementById('loginError').textContent = 'Wrong username or password.';
    return;
  }

  localStorage.setItem('cms_session', user.id);
  openPortal(user);
}

function logout() {
  localStorage.removeItem('cms_session');
  location.reload();
}

function openPortal(user) {
  doctor = user;
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('portal').classList.remove('hidden');
  document.getElementById('doctorName').textContent = user.name;
  showTab('queue');
}


// =====================================================
// 5. TABS
// =====================================================
function showTab(name) {
  for (const tab of ['queue', 'history', 'labs']) {
    document.getElementById('page-' + tab).classList.toggle('hidden', tab !== name);
    document.getElementById('tab-' + tab).classList.toggle('active', tab === name);
  }

  if (name === 'queue')   drawQueue();
  if (name === 'history') drawHistory();
  if (name === 'labs')    drawLabs();
}


// =====================================================
// 6. THE THREE PAGES
// =====================================================

// Patients waiting to see this doctor
function drawQueue() {
  const waiting = getTable('appts').filter(a =>
    a.did == doctor.id && (a.status === 'booked' || a.status === 'checkedin'));

  const rows = waiting.map(a => [
    safe(a.date) + ' ' + safe(a.time),
    patientName(a.pid),
    safe(a.reason),
    `<button onclick="openConsultation(${a.id})">See patient</button>`
  ]);

  document.getElementById('page-queue').innerHTML =
    '<h2>My queue</h2>' +
    makeTable(['When', 'Patient', 'Reason', ''], rows, 'No patients waiting.');
}

// Past consultations by this doctor
function drawHistory() {
  const done = getTable('consults').filter(c => c.did == doctor.id).reverse();

  const rows = done.map(c => [
    new Date(c.created).toLocaleDateString(),
    patientName(c.pid),
    safe(c.diagnosis),
    safe(c.notes)
  ]);

  document.getElementById('page-history').innerHTML =
    '<h2>Consultations</h2>' +
    makeTable(['Date', 'Patient', 'Diagnosis', 'Notes'], rows, 'No consultations yet.');
}

// Lab tests this doctor ordered
function drawLabs() {
  const orders = getTable('labs').filter(l => l.did == doctor.id).reverse();

  const rows = orders.map(l => [
    patientName(l.pid),
    safe(l.test),
    l.status === 'done' ? safe(l.result) : 'Waiting for result'
  ]);

  document.getElementById('page-labs').innerHTML =
    '<h2>Lab results</h2>' +
    makeTable(['Patient', 'Test', 'Result'], rows, 'You have not ordered any lab tests.');
}


// =====================================================
// 7. CONSULTATION POPUP
// =====================================================

// Open the popup for one appointment
function openConsultation(appointmentId) {
  appointmentBeingSeen = findRow('appts', appointmentId);

  document.getElementById('consultTitle').textContent =
    'Consultation: ' + findRow('patients', appointmentBeingSeen.pid).name;

  // Clear the form
  document.getElementById('diagnosis').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('dosage').value = '';

  // Fill the medicine list
  const medicineOptions = getTable('meds')
    .map(m => `<option value="${m.id}">${safe(m.name)} (${m.stock} in stock)</option>`)
    .join('');
  document.getElementById('medicine').innerHTML = '<option value="">None</option>' + medicineOptions;

  // Fill the lab test list
  const labOptions = LAB_TESTS.map(t => `<option>${t}</option>`).join('');
  document.getElementById('labTest').innerHTML = '<option value="">None</option>' + labOptions;

  document.getElementById('consultDialog').showModal();
}

// Save everything from the popup
function saveConsultation() {
  const diagnosis = document.getElementById('diagnosis').value.trim();
  if (diagnosis === '') {
    alert('Please enter a diagnosis.');
    return;
  }

  const appt = appointmentBeingSeen;

  // 1. Save the consultation itself
  addRow('consults', {
    aid: appt.id,
    pid: appt.pid,
    did: doctor.id,
    diagnosis: diagnosis,
    notes: document.getElementById('notes').value
  });

  // 2. If a medicine was chosen, send a prescription to the pharmacist
  const medicineId = document.getElementById('medicine').value;
  if (medicineId) {
    addRow('rx', {
      pid: appt.pid,
      did: doctor.id,
      status: 'pending',
      items: [{ mid: Number(medicineId), dose: document.getElementById('dosage').value }]
    });
  }

  // 3. If a lab test was chosen, send an order to the lab
  const labTest = document.getElementById('labTest').value;
  if (labTest) {
    addRow('labs', { pid: appt.pid, did: doctor.id, test: labTest, status: 'pending', result: '' });
  }

  // 4. Mark the appointment as finished
  updateRow('appts', appt.id, { status: 'completed' });

  document.getElementById('consultDialog').close();
  drawQueue();
}


// =====================================================
// 8. START
// =====================================================
createSampleData();

// If the doctor is already signed in, skip the login page
const savedUser = findRow('users', localStorage.getItem('cms_session'));
if (savedUser.role === 'doctor') openPortal(savedUser);
</script>
</body>
</html>
